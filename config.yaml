# RouteMind - ML engine configuration
# Every setting used by train.py / predict.py lives here, so the report
# can show and justify one file instead of numbers hidden inside the code.

data:
  path: data/DataCoSupplyChainDataset.csv
  encoding: latin-1          # the DataCo CSV is not UTF-8
  label: Late_delivery_risk  # 1 = late, 0 = on time

  # Columns only known AFTER delivery. Keeping them would leak the answer
  # (accuracy near 100%) and the model would be useless for real decisions.
  leakage_columns:
    - Days for shipping (real)
    - Delivery Status
    - shipping date (DateOrders)
    - Order Status

  # Rows removed before training. Cancelled shipments are labelled 0
  # ("on time") although they were never delivered, so they would teach
  # the model a false pattern. (Found in explore_data.py, step 1.2.)
  exclude_rows:
    column: Delivery Status
    values:
      - Shipping canceled

  # Features the agent can see at the moment an order is placed.
  # Personal data (names, email, password, street) is never used.
  numeric_features:
    - Days for shipment (scheduled)
    - Order Item Quantity
    - Order Item Product Price
    - Order Item Discount Rate
    - Sales
  categorical_features:
    - Type
    - Shipping Mode
    - Market
    - Order Region
    - Customer Segment
    - Category Name
    - Department Name
  date_column: order date (DateOrders)   # turned into month / weekday / hour
  date_format: "%m/%d/%Y %H:%M"          # e.g. 1/31/2018 22:56

# Edge-case handling for new orders arriving with gaps or new values.
# The training data has no missing values, so these steps change nothing
# in training; they protect predict.py and the agent in live use.
preprocessing:
  numeric_impute: median          # missing number -> typical (middle) value
  categorical_impute: Unknown     # missing category -> the word "Unknown"
  unknown_categories: ignore      # unseen category -> all one-hot columns 0

split:
  test_size: 0.2
  stratify: true
  random_state: 42

# Main model - powers the agent
random_forest:
  n_estimators: 200          # number of trees: more = more stable votes, slower
  max_depth: 10              # smallest depth where validation score stops improving
                             # (tune.py, logs/tune_20261110_191513.log; 5 is worse,
                             # 10/15/20 identical, no limit starts to overfit)
  min_samples_split: 10      # a node needs 10 orders before it may split
  min_samples_leaf: 5        # every leaf keeps at least 5 orders (no 1-order rules)
  class_weight: balanced     # weight classes equally despite the 57/43 split
  n_jobs: -1                 # use all CPU cores
  random_state: 42

# Hyperparameter sweep (tune.py): each max_depth is tried with 5-fold
# cross-validation on the TRAINING set only. null = no depth limit.
tuning:
  max_depth_values: [5, 10, 15, 20, null]

# Comparison model - has the learning rate / epochs / batch size the brief asks about
mlp:
  hidden_layer_sizes: [64, 32]
  learning_rate_init: 0.001  # Adam default: small, stable steps
  batch_size: 256            # orders per weight update
  max_iter: 30               # maximum epochs (full passes over the training data)
  early_stopping: true       # stop when validation score stops improving
  validation_fraction: 0.1
  n_iter_no_change: 5        # patience: epochs without improvement before stopping
  random_state: 42

evaluation:
  cv_folds: 5
  primary_metric: recall     # recall on the "late" class (1)

  # Operating threshold: flag "late" when risk >= this.
  # Rule: choose a threshold on a stable plateau, where small score changes
  # do not flip decisions. On training CV every threshold from 0.38 to 0.70
  # gives the same result. F1/F2 were rejected (they flag 93-97% of orders).
  # Evidence: logs/threshold_20261110_202310.log
  decision_threshold: 0.5

  # Reported next to it in the final test run for comparison only:
  # "highest recall with precision >= 0.80" on training CV. Not used by the
  # agent because +/-0.02 around it changes the decision for 55% of orders.
  comparison_threshold: 0.35

  # ASSUMPTION: scores within +/- this of the operating threshold are
  # "uncertain" and go to a human. Stated choice, not derived from data.
  uncertainty_band: 0.05

# Step 5 (select_threshold.py): candidates are computed from cross-validated
# probabilities on the TRAINING set only. The rule is our stated choice,
# not a business cost figure.
threshold_selection:
  precision_floors: [0.70, 0.80, 0.85]   # "highest recall with precision >= floor"
  band_widths: [0.02, 0.05, 0.10]        # uncertainty band half-widths to compare
  calibration_bins: 10

# predict.py: when a single new order is scored.
prediction:
  # If one of these is missing or has a value never seen in training, the
  # model has lost its main signal (92% of feature importance), so the
  # score is not trusted and the order goes to a human.
  critical_features:
    - Shipping Mode
    - Days for shipment (scheduled)
  sample_orders: sample_orders.json

# agent_demo.py: every number the agent reasons with. These match the
# Task 1 Section 1.3 worked examples (Member A). Evidence and stock are SIMULATED:
# the DataCo dataset has no GPS, sensor or stock data.
agent:
  scenarios: agent_scenarios.json

  bayes:
    prior_clamp: [0.01, 0.99]       # keep the RF prior away from 0 and 1
    posterior_decimals: 2           # round before the fuzzy step
    evidence: "truck idle > 60 min at unscheduled location (SIMULATED)"
    # P(evidence | late), P(evidence | on time)
    idle_true:  {p_given_late: 0.70, p_given_on_time: 0.15}
    idle_false: {p_given_late: 0.30, p_given_on_time: 0.85}
    # idle unknown (null): no update, posterior = prior

  fuzzy:
    # trap = trapezoid [a, b, c, d]; tri = triangle [a, b, c]
    risk:
      Low:    {shape: trap, points: [0, 0, 0.2, 0.4]}
      Medium: {shape: tri,  points: [0.3, 0.5, 0.7]}
      High:   {shape: trap, points: [0.6, 0.8, 1, 1]}
    stock_days:                      # SIMULATED input
      Critical: {shape: trap, points: [0, 0, 1, 3]}
      Low:      {shape: tri,  points: [2, 4, 6]}
      Adequate: {shape: trap, points: [5, 7, .inf, .inf]}
    # IF risk AND stock THEN action   (AND = minimum)
    rules:
      R1: [Low, Critical, Monitor]
      R2: [Low, Low, Continue]
      R3: [Low, Adequate, Continue]
      R4: [Medium, Critical, Reroute]
      R5: [Medium, Low, Monitor]
      R6: [Medium, Adequate, Monitor]
      R7: [High, Critical, Escalate]
      R8: [High, Low, Reroute]
      R9: [High, Adequate, Monitor]
    outputs: {Continue: 10, Monitor: 40, Reroute: 70, Escalate: 95}
    urgency_decimals: 1             # round BEFORE banding
    # urgency < 25 Continue | < 55 Monitor | < 85 Reroute | >= 85 Escalate
    bands:
      - [25, Continue]
      - [55, Monitor]
      - [85, Reroute]
      - [.inf, Escalate]

  approval_required: [Reroute]      # high-risk action: human must approve
  reasoning_card_for: [Reroute, Escalate]

  reject_reasons:                   # U1-U4 = uncertainty sources in Task 1.1
    "1": "Sensor/data looks wrong (U1)"
    "2": "Information out of date or missing (U2)"
    "3": "Driver/planner/customer instruction (U3)"
    "4": "Carrier or system unavailable (U4)"
    "5": "Cost or business reason"
    "6": "Other (free text)"

  tools:                            # SIMULATED routing API
    max_retries: 3                  # per reroute call
    backoff_seconds: [1, 2, 4]      # wait before retry 1, 2, 3 (printed, not slept)
    max_reroutes_per_order: 3       # loop limit, then escalate

  logs:
    feedback: logs/feedback_log.jsonl   # human rejections (appended)
    incidents: logs/incident_log.jsonl  # long-term memory stand-in (appended)
    similar_cases_shown: 3

paths:
  rf_model_out: models/routemind_rf.joblib
  mlp_model_out: models/routemind_mlp.joblib
  test_set_out: models/test_set.joblib
  log_dir: logs
  output_dir: outputs
